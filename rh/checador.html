<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checador RH 19H</title>
<meta name="theme-color" content="#DE0A14">
<link rel="manifest" href="manifest-checador.json">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="estilos.css?v=20261102">
<link rel="stylesheet" href="rh.css?v=20261102">
</head>
<body class="app-ui kiosco">
<div id="app"><div class="login"><div class="muted">Cargando…</div></div></div>
<script src="config.js"></script>
<script src="core.js?v=20261102"></script>
<script>
/* =====================================================================
   CHECADOR (kiosco en tablet a la entrada)
   - Lee el QR del gafete con la cámara (o No. de empleado + NIP)
   - Toma una foto en el momento (evita que otro cheque por él)
   - La hora la pone el servidor, no la tablet
   - Si se va el internet, guarda y envía al reconectar
   ===================================================================== */
(async function () {
  const I = RH, { $, esc } = I; const app = $('#app');
  try { await I.start({ appKey: 'checador' }); } catch (e) { return; }
  let D = { checadas: {} }, off = null, stream = null, det = null, scanning = false, bloqueo = 0, U = null, gaf = {};
  const COLA = 'rh19_cola_checador';
  const cola = () => { try { return JSON.parse(localStorage.getItem(COLA) || '[]'); } catch (e) { return []; } };
  const guardaCola = c => { try { localStorage.setItem(COLA, JSON.stringify(c)); } catch (e) { } };

  I.AUTH.onChange(u => {
    if (off) { off(); off = null; } detener();
    if (!u || !u.rol || !['kiosco', 'master', 'rh'].includes(u.rol)) { U = null; I.pantallaLogin(app, { titulo: 'Checador', icono: '⏱️', demoTxt: 'MODO DEMO · usuario: kiosco · contraseña: demo' }); if (u && u.rol) $('#lg-e').textContent = 'Este usuario no puede abrir el checador.'; return; }
    U = u; pantalla();
    off = I.suscribir(['config', 'empleados', 'checadas', 'gafetes'], I.addDias(I.hoyISO(), -2), d => { D = d; gaf = d.gafetes || {}; });
    I.DB.onConexion(c => { const b = $('#k-red'); if (b) { b.className = 'b ' + (c ? 'b-grn' : 'b-red'); b.textContent = c ? 'En línea' : 'Sin internet · se guardan y se envían al volver'; } if (c) vaciarCola(); });
  });

  function pantalla() {
    app.innerHTML = `
    ${I.DEMO ? '<div class="demo-bar">MODO DEMO · prueba con No. 1013 y NIP 123456 · <a href="index.html?demo=1">programa principal</a></div>' : ''}
    <div class="k-wrap">
      <div class="k-top top-k"><div class="brand"><div class="sello"><img src="img/logo-19h.png" alt="Los 19 Hermanos"></div><div class="sello"><img src="img/logo-petfood.png" alt="División Pet Food"></div><div><b>Checador</b><small>${esc(I.CFG.EMPRESA || '')}</small></div></div><span class="sp"></span><span id="k-red" class="b b-gry">…</span><button class="btn sm ghost" id="k-out">Salir</button></div>
      <div class="k-reloj"><div id="k-h">--:--</div><div id="k-f" class="muted"></div></div>
      <div class="k-cuerpo">
        <div class="k-cam"><video id="k-v" playsinline muted></video><div class="k-marco"></div><div id="k-cam-msg" class="k-cam-msg">Toca "Activar cámara" y acerca tu gafete</div></div>
        <div class="k-lado">
          <button class="btn pri big" id="k-cam">Activar cámara</button>
          <div class="k-o">o con tu número y NIP</div>
          <input id="k-n" inputmode="numeric" placeholder="No. de empleado" autocomplete="off">
          <input id="k-p" inputmode="numeric" type="password" maxlength="6" placeholder="NIP (6 dígitos)" autocomplete="off">
          <div class="k-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].map(x => `<button data-k="${x}">${x}</button>`).join('')}</div>
        </div>
      </div>
      <div id="k-res" class="k-res" hidden></div>
      <canvas id="k-c" width="240" height="180" hidden></canvas>
    </div>`;
    $('#k-out').onclick = () => I.AUTH.logout();
    $('#k-cam').onclick = iniciarCam;
    let foco = '#k-n'; $('#k-n').onfocus = () => foco = '#k-n'; $('#k-p').onfocus = () => foco = '#k-p';
    document.querySelectorAll('.k-pad button').forEach(b => b.onclick = () => { const k = b.dataset.k; const el = $(foco); if (k === '⌫') el.value = el.value.slice(0, -1); else if (k === 'OK') { if (foco === '#k-n' && $('#k-n').value) { foco = '#k-p'; $('#k-p').focus(); } else porNip(); } else el.value += k; });
    $('#k-p').onkeydown = ev => { if (ev.key === 'Enter') porNip(); };
    const tick = () => { if (!$('#k-h')) return; const d = new Date(I.now()); $('#k-h').textContent = I.pad(d.getHours()) + ':' + I.pad(d.getMinutes()) + ':' + I.pad(d.getSeconds()); $('#k-f').textContent = I.fDiaL(I.iso(d)); };
    tick(); clearInterval(window._kt); window._kt = setInterval(tick, 1000);
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => { });
  }

  async function iniciarCam() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      const v = $('#k-v'); v.srcObject = stream; await v.play(); $('#k-cam').hidden = true; $('#k-cam-msg').textContent = 'Acerca el código QR de tu gafete';
      if ('BarcodeDetector' in window) { det = new BarcodeDetector({ formats: ['qr_code'] }); }
      else { await I.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js').catch(() => { }); }
      scanning = true; loop();
    } catch (e) { $('#k-cam-msg').textContent = 'No se pudo abrir la cámara (' + e.message + '). Usa número y NIP.'; }
  }
  function detener() { scanning = false; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  async function loop() {
    if (!scanning) return; const v = $('#k-v'); if (!v) return;
    try {
      if (Date.now() > bloqueo && v.readyState >= 2) {
        let txt = null;
        if (det) { const r = await det.detect(v); if (r && r[0]) txt = r[0].rawValue; }
        else if (window.jsQR) { const c = document.createElement('canvas'); c.width = 480; c.height = 360; const cx = c.getContext('2d'); cx.drawImage(v, 0, 0, 480, 360); const im = cx.getImageData(0, 0, 480, 360); const r = jsQR(im.data, 480, 360); if (r) txt = r.data; }
        if (txt && /^RH19:/.test(txt)) { const id = gaf[txt.slice(5)]; bloqueo = Date.now() + 3500; if (id) await registrar(id, 'qr'); else resultado(false, 'Gafete no válido o dado de baja'); }
      }
    } catch (e) { }
    setTimeout(loop, 220);
  }
  async function porNip() {
    const n = $('#k-n').value.trim(), p = $('#k-p').value.trim(); if (!n || p.length < 4) return resultado(false, 'Escribe tu número y tu NIP');
    const L = I.vals(D.empleados).filter(e => e.estatus !== 'baja'); const e = L.find(x => String(x.num) === n);
    if (!e || !e.nipK || (await I.nipHash(e._k, p)) !== e.nipK) { $('#k-p').value = ''; return resultado(false, 'Número o NIP incorrecto'); }
    $('#k-n').value = ''; $('#k-p').value = ''; await registrar(e._k, 'nip');
  }
  function foto() {
    if (!stream || !D.C || !D.C.p.fotoKiosco) return null;
    const v = $('#k-v'), c = $('#k-c'); const cx = c.getContext('2d'); const r = v.videoWidth / v.videoHeight || 4 / 3; c.width = 200; c.height = Math.round(200 / r); cx.drawImage(v, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.55);
  }
  async function registrar(id, via) {
    const e = Object.assign({ _k: id }, D.empleados[id]); if (!e.nombre || e.estatus === 'baja') return resultado(false, 'Empleado no activo');
    const extra = { src: 'kiosco', via, foto: foto() || undefined, disp: U.usuario };
    try {
      const r = await Promise.race([I.checar(e, D, extra), new Promise((_, ko) => setTimeout(() => ko(new Error('lento')), 6000))]);
      if (r.dup) return resultado(true, e.nombre, 'Ya habías checado a las ' + I.hm(r.ts), 'dup');
      beep(true); resultado(true, e.nombre, r.tipo + ' · ' + I.hm(r.ts), r.tipo === 'Entrada' ? 'ent' : 'sal', e);
    } catch (x) {
      const c = cola(); c.push({ id, ts: I.now(), extra }); guardaCola(c);
      beep(true); resultado(true, e.nombre, 'Guardado sin internet · ' + I.hm(I.now()), 'off');
    }
  }
  async function vaciarCola() {
    const c = cola(); if (!c.length) return; const resto = [];
    for (const it of c) { try { const e = Object.assign({ _k: it.id }, D.empleados[it.id]); await I.checar(e, D, Object.assign({}, it.extra, { ts: it.ts, diferida: true })); } catch (e) { resto.push(it); } }
    guardaCola(resto);
  }
  function resultado(ok, titulo, sub, tipo, e) {
    const box = $('#k-res'); if (!box) return;
    let extra = '';
    if (ok && e && D.C && tipo === 'ent') { const h = I.horario(e, I.hoyISO(), D.C); if (h) { const d = new Date(I.now()); const m = d.getHours() * 60 + d.getMinutes(); if (m - h.e > D.C.p.toleranciaMin) extra = `<div class="k-ret">Retardo de ${m - h.e} min · tu horario es ${h.ent}</div>`; } }
    box.className = 'k-res ' + (ok ? (tipo || 'ent') : 'err'); box.hidden = false;
    box.innerHTML = `<div class="k-ico">${ok ? (tipo === 'sal' ? '👋' : tipo === 'dup' ? 'ℹ️' : '✅') : '⛔'}</div><div><div class="k-t">${esc(titulo)}</div><div class="k-s">${esc(sub || '')}</div>${extra}</div>`;
    if (!ok) beep(false);
    clearTimeout(box._h); box._h = setTimeout(() => box.hidden = true, ok ? 3200 : 2600);
  }
  let ac = null;
  function beep(ok) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = ok ? 880 : 220; g.gain.value = 0.15; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + (ok ? 0.15 : 0.4)); } catch (e) { } }
  if ('serviceWorker' in navigator && !I.DEMO) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
