<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Silver Kan — App Vendedor</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Silver Kan">
<meta name="theme-color" content="#1A2E5A">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#1A2E5A;--gold:#E8A020;--bg:#0F1E3C;--mid:#162340;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#e8eef7;min-height:100vh}
header{background:var(--navy);padding:12px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:800}header .sub{font-size:11px;color:#9fb0cc}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.drop{border:2px dashed #2a3a5c;border-radius:14px;padding:22px 16px;text-align:center;background:var(--mid);margin-bottom:14px}
.drop b{color:var(--gold)}
.btn{background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:11px 18px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
input[type=file]{display:none}
.search{width:100%;background:var(--mid);border:1px solid #2a3a5c;border-radius:10px;padding:12px 14px;color:#fff;font-size:16px;margin-bottom:10px}
.hint{font-size:12px;color:#9fb0cc;margin:2px 2px 10px}
.list{display:flex;flex-direction:column;gap:6px}
.li{background:var(--mid);border:1px solid #22304d;border-radius:10px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.li b{font-size:14px}.li .lv{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}
.card{background:#fff;color:#16223a;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card .top{padding:16px;color:#fff}
.card .top h2{font-size:19px;font-weight:900}.card .top .vend{font-size:12px;opacity:.85;margin-top:2px}
.badge{display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);border-radius:24px;padding:5px 14px;font-weight:900;font-size:15px}
.kpis{display:flex;gap:8px;padding:14px 16px 4px}
.kpi{flex:1;background:#f4f6fa;border-radius:12px;padding:10px;text-align:center}
.kpi .n{font-size:19px;font-weight:900;color:var(--navy)}.kpi .l{font-size:10.5px;color:#5b6472;margin-top:2px}
.need{padding:6px 16px 16px}
.need h3{font-size:13px;color:var(--navy);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;background:#f4f6fa;margin-bottom:7px}
.row .t{font-size:13px;color:#3d4552}.row .v{font-size:15px;font-weight:900;color:var(--navy);text-align:right;white-space:nowrap}
.row.ok{background:#e5f4ea}.row.ok .v{color:#1a7a3f}
.row.no{background:#fdeceb}
.qnow{margin:0 16px;background:#eef4ff;border:1px solid #c7dbff;border-radius:12px;padding:11px 13px}
.qnow .h{font-size:12px;color:#3b5ba5;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.qnow .b{font-size:22px;font-weight:900;color:var(--navy);margin-top:2px}
.qnow .s{font-size:12px;color:#5b6472;margin-top:3px}
.bar{height:8px;background:#dbe4f5;border-radius:6px;margin-top:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:#3b82f6;border-radius:6px}
.msg{background:#fff7e6;border:1px solid #f4d58a;border-radius:10px;padding:11px 13px;font-size:13px;color:#7a5a12;margin:14px 16px 16px}
.back{background:none;border:none;color:var(--gold);font-size:14px;font-weight:700;cursor:pointer;padding:8px 0;margin-bottom:6px}
.foot{font-size:11px;color:#7c8aa5;text-align:center;margin-top:16px;line-height:1.5}
.synced{background:#10233f;border:1px solid #21406e;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.synced .l{font-size:11px;color:#9fb0cc}.synced .l b{color:#E8A020}
.synced .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px}
.rfr{background:#1e3a6b;color:#dbeafe;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
#wm{position:fixed;inset:0;z-index:9999;pointer-events:none;background-repeat:repeat;display:none}

.dbox{background:#fff;border:1px solid #e2e6ee;border-radius:12px;padding:12px 13px;margin:10px 0}
.dbox.proy{border-left:4px solid #E8A020;background:#fffdf7}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dlbl{font-size:13px;font-weight:800;color:#1A2E5A}
.dsub{font-size:11px;color:#7b8698;margin-top:2px}
.dnum{font-size:26px;font-weight:900;color:#1A2E5A;white-space:nowrap}
.dnum.proyn{color:#E8A020}
.drow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-top:1px solid #eef1f6;color:#3d4552}
.drow.si{color:#15803d}.drow.no{color:#7b8698}
.drow b{white-space:nowrap}
.pbar{height:6px;background:#eef1f6;border-radius:4px;overflow:hidden;margin:2px 0 4px}
.pbar i{display:block;height:100%}
.dhint{font-size:11px;color:#7b8698;padding-top:4px}
</style></head>
<body>
<div id="wm"></div>
<header><div style="font-size:22px">🐶</div><div><h1>Silver Kan — App Vendedor</h1><div class="sub">Consulta el nivel y descuentos de tu cliente</div></div>
<div style="margin-left:auto;display:flex;align-items:center;gap:3px" title="Ajusta el tamaño si no ves todo completo">
<button onclick="setZoom(-0.1)" style="background:#0b1628;color:#dbeafe;border:1px solid #2a3a5c;border-radius:8px;width:30px;height:30px;font-size:15px;font-weight:800;cursor:pointer;line-height:1">A−</button>
<span id="zlvl" style="font-size:10px;color:#9fb0cc;min-width:30px;text-align:center">100%</span>
<button onclick="setZoom(0.1)" style="background:#0b1628;color:#dbeafe;border:1px solid #2a3a5c;border-radius:8px;width:30px;height:30px;font-size:15px;font-weight:800;cursor:pointer;line-height:1">A+</button>
</div></header>
<div class="wrap" id="wrap">
  <div class="drop" id="drop">
    <div style="font-size:34px">🔑</div>
    <p style="margin:8px 0 6px;font-size:14px">Pega el <b>código</b> que te envió tu gerente</p>
    <textarea id="code" placeholder="Pega aquí el código..." style="width:100%;height:70px;background:#0b1628;border:1px solid #2a3a5c;border-radius:10px;color:#cbd5e1;padding:10px;font-size:12px;resize:none"></textarea>
    <button class="btn" onclick="loadCode()">Ver mis clientes</button>
    <p class="hint" style="margin-top:10px">Si tu gerente te pasó un <b>link</b>, ábrelo y verás tus clientes actualizados solos — sin pegar nada.</p>
    <details style="margin-top:14px;text-align:left"><summary style="font-size:12px;color:#7c8aa5;cursor:pointer">Soy el gerente — subir Excel de Odoo</summary>
      <button class="btn" style="background:#2a3a5c;color:#cbd5e1;margin-top:8px" onclick="document.getElementById('fi').click()">Elegir archivo</button>
      <input type="file" id="fi" accept=".xlsx,.xls">
    </details>
  </div>
  <div id="loading" style="display:none;text-align:center;padding:40px 0;color:#9fb0cc">Cargando datos en vivo…</div>
  <div id="app" style="display:none"></div>
</div>
<script>
const SK_DB='https://embarques-mascotas-default-rtdb.firebaseio.com'; // Firebase de embarques (misma licencia)
const PREMIUM_RE=/PREMIUM/i, GATO_RE=/SILVER\s*CAT\s*15/i, PETFOOD_RE=/PET\s*FOOD/i;
const PREM_CODES=['04MAS001','04MAS0011','04MAS0019','04MAS006']; // Silver Kan Premium 25/20 + Silver Cat 15
const TIERS=[["DIAMANTE_PLUS",15000,2.0,0.75,0.75,2],["DIAMANTE",9000,2.0,0.25,0.25,2],["PLATINO",5000,1.75,0.5,0.25,3],["ORO",3000,1.5,0.5,0.5,6],["PLATA",1000,1.25,0.75,0.5,10],["BRONCE",600,1.0,0.75,0.75,20],["COBRE",200,0.75,0.75,1.0,30],["INICIAL",0,0,0,0,999]];
// Bono Premium+ (los % los define el gerente en el dashboard; aquí van los valores por defecto).
let PREM={base:3,u1:5,e1:0.5,u2:7.5,e2:1.0};
let COBRE={enabled:false,opcion:1,pct:0.5,min:300,umbral:20}; // nivel Cobre (lo define el gerente)
let PROSPECTS=[], VENTAS=null, ALERTAS=null; let VIEW='clientes'; let CARDOPEN=false;
function mapsUrl(la,lo,q){var ap=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent||'');if(la&&lo)return ap?('https://maps.apple.com/?ll='+la+','+lo+'&q='+encodeURIComponent(q||'ubicaci\u00F3n')):('https://www.google.com/maps/search/?api=1&query='+la+','+lo);return ap?('https://maps.apple.com/?q='+encodeURIComponent(q||'')):('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||''));}
function setView(v){CARDOPEN=false;OBSEDIT=-1;VIEW=v;if(v==='prosp')renderProspectos('');else if(v==='ventas')renderVentas();else if(v==='alertas')renderAlertas();else if(v==='monitoreo')abrirMonitoreo();else renderList('');}
function vtBtn(v,lbl){return '<button onclick="setView(\''+v+'\')" style="flex:1;padding:9px 4px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:12.5px;background:'+(VIEW===v?'var(--gold)':'var(--mid)')+';color:'+(VIEW===v?'var(--navy)':'#9fb0cc')+'">'+lbl+'</button>';}
function viewTabs(){return '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'+vtBtn('clientes','\uD83D\uDC65 Clientes')+vtBtn('ventas','\uD83D\uDCC8 Ventas')+vtBtn('alertas','\uD83D\uDD14 Alertas')+vtBtn('prosp','\uD83D\uDCCD Prospectos'+(PROSPECTS.length?(' ('+PROSPECTS.length+')'):''))+(esAdminApp()?vtBtn('monitoreo','\uD83D\uDD0E Monitoreo'):'')+'</div>';}
// Acceso especial: la pestaña Monitoreo solo existe para la cuenta de ADMINISTRACIÓN.
// El resto de los vendedores sigue viendo únicamente su propia cartera.
function _kp(s){return (s||'').toString().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function esAdminApp(){var k=_kp(CLOUD.v||APPVEND||'');return k==='ADMINISTRACION'||k==='ADMINISTRACIN';}
function premBoost(mix){return mix>=PREM.u2?PREM.e2:(mix>=PREM.u1?PREM.e1:0);}
const NIVLAB={DIAMANTE_PLUS:'DIAMANTE PLUS'};
const MES_NOM={1:'enero',2:'febrero',3:'marzo',4:'abril',5:'mayo',6:'junio',7:'julio',8:'agosto',9:'septiembre',10:'octubre',11:'noviembre',12:'diciembre'};
const Q_GROUPS=[[[2,3,4],'Feb–Abr'],[[5,6,7],'May–Jul'],[[8,9,10],'Ago–Oct'],[[11,12,1],'Nov–Ene']];
function quarterOf(m){for(const g of Q_GROUPS){if(g[0].includes(m))return {months:g[0],label:g[1]};}return {months:[m],label:MES_NOM[m]||''};}
function tierOf(avg){for(const t of TIERS){if(avg>=t[1])return t;}return TIERS[TIERS.length-1];}
function nextTier(n){const i=TIERS.findIndex(t=>t[0]===n);return i>0?TIERS[i-1]:null;}
function nivLab(n){return NIVLAB[n]||n;}
const NIVCOL={DIAMANTE_PLUS:'#7c3aed',DIAMANTE:'#0e7490',PLATINO:'#475569',ORO:'#a16207',PLATA:'#64748b',BRONCE:'#b45309',COBRE:'#b87333',INICIAL:'#6b7280'};
const NIVBG={DIAMANTE_PLUS:'linear-gradient(135deg,#6d28d9,#c4b5fd)',DIAMANTE:'linear-gradient(135deg,#0891b2,#22d3ee)',PLATINO:'linear-gradient(135deg,#475569,#94a3b8)',ORO:'linear-gradient(135deg,#a16207,#f5c842)',PLATA:'linear-gradient(135deg,#64748b,#cbd5e1)',BRONCE:'linear-gradient(135deg,#b45309,#f0a868)',COBRE:'linear-gradient(135deg,#8a5a2b,#d4915d)',INICIAL:'linear-gradient(135deg,#4b5563,#9ca3af)'};
var MESEVAL=0, MESANT=0, MESCURSO=0, MESVIT=0, CORTE=null;
let CLIENTS={}, APPVEND='', APPPERIOD='', APPMONTH=0, APPQ=null, APPUPDATED='', CLOUD={db:'',v:''};
let APPEVAL='TRIM', APPEVALLABEL='';                       // periodo de evaluación (definido por el gerente)
function PMULT(){return APPEVAL==='MES'?1:3;}               // metas: mensuales (x1) o trimestrales (x3)
function perWord(){return APPEVAL==='MES'?'mes':'trimestre';}
function perLabel(){return APPEVALLABEL||(APPEVAL==='MES'?(MES_NOM[APPMONTH]||'mes'):(APPQ?APPQ.label:'trimestre'));}
function fmt(n){return Math.round(n).toLocaleString('es-MX');}
// ── Tamaño de la app (ayuda a teléfonos con display grande / "mucho zoom") ──
function applyZoom(){try{var z=parseFloat(localStorage.getItem('appZoom04mas'))||1;document.body.style.zoom=z;var el=document.getElementById('zlvl');if(el)el.textContent=Math.round(z*100)+'%';}catch(e){}}
function setZoom(d){try{var z=parseFloat(localStorage.getItem('appZoom04mas'))||1;z=Math.min(1.4,Math.max(0.6,Math.round((z+d)*100)/100));localStorage.setItem('appZoom04mas',String(z));applyZoom();}catch(e){}}
// ── Marca de agua trazable: nombre del vendedor + fecha repetido sobre toda la pantalla ──
function applyWatermark(){
  var el=document.getElementById('wm'); if(!el)return;
  var label=(APPVEND||'Silver Kan').toString().toUpperCase();
  var dev=''; try{dev=(localStorage.getItem('sk_dev_'+(CLOUD.v||''))||'').slice(1,7);}catch(e){}
  var d=new Date(); var p=function(n){return ('0'+n).slice(-2);};
  var stamp=p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
  var txt=(label+' · '+stamp+(dev?(' · '+dev):'')).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="330" height="190">'
    +'<text x="6" y="150" transform="rotate(-28 6 150)" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#9fb6dd" fill-opacity="0.15">'+txt+'</text></svg>';
  el.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
  el.style.display='block';
}

// ── SYNC EN LA NUBE (link con #v=...&db=...) ─────────────────────────────────
function parseHash(){
  const h=(location.hash||'').replace(/^#/,''); const o={};
  h.split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
  return o;
}
function applyPayload(p){
  APPVEND=p.v||''; APPPERIOD=p.period||''; APPMONTH=p.lastMonth||p.m||0;
  MESEVAL=p.mesEval||0; MESANT=p.mesAnt||0; MESCURSO=p.mesCurso||0;
  MESVIT=p.mesVitrina||0; CORTE=p.corte||null;   // mes en vitrina (lo manda el calendario) y corte confirmado
  // Reportes publicados por una versión anterior no traen estos campos: se deducen del
  // último mes con datos, para que las etiquetas de mes nunca queden en blanco ni en enero.
  if(!MESCURSO&&!MESEVAL&&APPMONTH){ MESCURSO=APPMONTH; MESEVAL=((APPMONTH-2+12)%12)+1; MESANT=((APPMONTH-3+12)%12)+1; }
  APPQ=p.q||(APPMONTH?quarterOf(APPMONTH):null);
  APPUPDATED=p.updatedStr||'';
  if(p.prem){PREM=Object.assign({base:3,u1:5,e1:0.5,u2:7.5,e2:1.0},p.prem);} // % del Bono Premium+ definidos por el gerente
  APPEVAL=(p.evalPeriod==='MES'||p.evalPeriod==='TRIM')?p.evalPeriod:'TRIM';   // periodo de evaluación
  APPEVALLABEL=p.evalLabel||'';
  if(p.cobre)COBRE=Object.assign({enabled:false,opcion:1,pct:0.5,min:300,umbral:20},p.cobre);
  PROSPECTS=Array.isArray(p.prospects)?p.prospects:[];
  VENTAS=p.ventas||null;
  ALERTAS=p.alertas||null;
  CLIENTS={};
  (p.rows||[]).forEach(r=>{CLIENTS[r.n]={nombre:r.n,vend:APPVEND,avg:r.avg||0,mix:r.mix||0,mixp:(r.mixp!=null?r.mixp:r.mix)||0,cur:r.cur||0,qtd:r.qtd!=null?r.qtd:(r.cur||0),qp:r.qp||0,qpb:(r.qpb!=null?r.qpb:r.qp)||0,estado:r.e||'',pm:r.pm||null,desc:(r.desc!=null?r.desc:null),crecio:!!r.crecio,premOk:!!r.premOk,boost:r.boost||0,evalSac:r.evalSac||0,antSac:r.antSac||0,premEval:r.premEval||0};});
  applyWatermark();
}
function fetchCloud(){
  const q=parseHash(); CLOUD.db=q.db||SK_DB; CLOUD.v=q.v||'';
  if(!CLOUD.db||!CLOUD.v)return false;
  document.getElementById('drop').style.display='none';
  document.getElementById('loading').style.display='block';
  const url=CLOUD.db.replace(/\/$/,'')+'/skan/'+encodeURIComponent(CLOUD.v)+'.json';
  fetch(url,{cache:'no-store'}).then(r=>r.json()).then(p=>{
    document.getElementById('loading').style.display='none';
    if(!p||!p.rows){document.getElementById('drop').style.display='block';document.getElementById('app').innerHTML='<div class="hint">Aún no hay datos publicados para este vendedor. Pídele a tu gerente que cargue el reporte.</div>';document.getElementById('app').style.display='block';return;}
    applyPayload(p); renderList('');
  }).catch(e=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('drop').style.display='block';
    alert('No se pudo conectar a los datos en vivo. Revisa tu internet e inténtalo de nuevo.');
  });
  return true;
}
function refreshCloud(){ if(CLOUD.db&&CLOUD.v)fetchCloud(); }

function loadCode(){
  const raw=(document.getElementById('code').value||'').trim().replace(/\s+/g,'');
  if(!raw){alert('Pega primero el código que te envió tu gerente.');return;}
  try{
    const s=decodeURIComponent(escape(atob(raw)));
    let p;
    if(s.charAt(0)==='{'){ p=JSON.parse(s); applyPayload(p); }
    else{
      const a=s.split('|'); if(a[0]!=='SK1')throw 0;
      APPVEND=a[1]||''; APPPERIOD=a[2]||''; APPMONTH=parseInt(a[3])||0; APPQ=APPMONTH?quarterOf(APPMONTH):null; APPUPDATED='';
      CLIENTS={};
      (a[4]||'').split(';').filter(Boolean).forEach(r=>{const b=r.split('~');const n=b[0];CLIENTS[n]={nombre:n,vend:APPVEND,avg:parseInt(b[1])||0,mix:(parseInt(b[2])||0)/10,cur:parseInt(b[3])||0,qtd:parseInt(b[4])||parseInt(b[3])||0,qp:parseInt(b[5])||0};});
    }
    if(!Object.keys(CLIENTS).length)throw 0;
    document.getElementById('drop').style.display='none';
    applyWatermark();
    renderList('');
  }catch(e){alert('El código no es válido o está incompleto. Pídeselo de nuevo a tu gerente.');}
}

const drop=document.getElementById('drop');
document.getElementById('fi').addEventListener('change',e=>{const f=e.target.files[0];if(f)read(f);});
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();}));
drop.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)read(f);});
function read(f){const r=new FileReader();r.onload=e=>{try{parse(e.target.result);}catch(err){alert('No se pudo leer: '+err.message);}};r.readAsArrayBuffer(f);}

function parse(buf){
  const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
  let rows=null;
  for(let si=wb.SheetNames.length-1;si>=0;si--){
    const rr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]],{header:1,raw:true,defval:''});
    if(rr.length>2&&String(rr[0][0])==='Column0'&&rr.filter(x=>String(x[0]||'').startsWith('[')).length>10){rows=rr;break;}
  }
  if(!rows){alert('Ese archivo no es el reporte pivote de Odoo (Análisis de ventas). Sube ese.');return;}
  let hasV=false,pn=false;
  for(let i=2;i<rows.length;i++){const c=rows[i][0];if(c===''||c==null)continue;if(c instanceof Date){pn=false;continue;}const t=String(c).trim();if(t==='Total')continue;if(t.startsWith('[')){pn=false;continue;}if(pn){hasV=true;break;}pn=true;}
  const nextType=(i)=>{for(let j=i+1;j<rows.length;j++){const c=rows[j][0];if(c===''||c==null)continue;if(c instanceof Date)return'date';const t=String(c).trim();if(t==='Total')continue;if(t.startsWith('['))return'prod';return'name';}return'end';};
  const data={};
  let cli=null,kind='skip',prod=null;
  for(let i=2;i<rows.length;i++){
    const c0=rows[i][0], val=parseFloat(rows[i][1])||0;
    if(c0===''||c0==null)continue;
    if(c0 instanceof Date){
      if(cli&&kind==='fin'&&prod&&val>0){const mm=(c0.getMonth()+1);const d=data[cli];
        d.qual[mm]=(d.qual[mm]||0)+val; if(prod.prem)d.prem[mm]=(d.prem[mm]||0)+val;}
      continue;
    }
    const t=String(c0).trim(); if(t==='Total')continue;
    if(t.startsWith('[')){
      const mp=t.match(/\[(\S+)\]/); const code=mp?mp[1].toUpperCase():'';
      const es04=t.toUpperCase().includes('04MAS'); const promo=/[PB]\d*$/.test(code);
      if(es04&&!promo){kind='fin';prod={petf:code.startsWith('04MAS010'),prem:(PREMIUM_RE.test(t)||GATO_RE.test(t)||PREM_CODES.includes(code))};}
      else{kind='skip';prod=null;}
      continue;
    }
    if(hasV&&nextType(i)!=='name'){kind='skip';prod=null;continue;}
    cli=t.toUpperCase();kind='skip';prod=null;if(!data[cli])data[cli]={qual:{},prem:{}};
  }
  const monTot={};for(const c in data){for(const m in data[c].qual)monTot[m]=(monTot[m]||0)+data[c].qual[m];}
  const maxM=Math.max(1,...Object.values(monTot));
  const comp=Object.keys(monTot).filter(m=>monTot[m]>=0.4*maxM);
  const nComp=comp.length||1;
  const lastM=Math.max(0,...Object.keys(monTot).map(Number));
  APPMONTH=lastM; APPVEND=''; APPQ=lastM?quarterOf(lastM):null; APPUPDATED='';
  const qm=APPQ?APPQ.months:[];
  CLIENTS={};
  for(const c in data){
    const d=data[c];
    const tq=comp.reduce((a,m)=>a+(d.qual[m]||0),0);
    const tp=comp.reduce((a,m)=>a+(d.prem[m]||0),0);
    const avg=Math.round(tq/nComp);
    const qtd=qm.reduce((a,m)=>a+(d.qual[m]||0),0);
    const qp=qm.reduce((a,m)=>a+(d.prem[m]||0),0);
    if(avg<=0&&tq<=0)continue;
    CLIENTS[c]={nombre:c,vend:'',avg,mix:tq>0?tp/tq*100:0,cur:Math.round(d.qual[lastM]||0),qtd:Math.round(qtd),qp:Math.round(qp)};
  }
  document.getElementById('drop').style.display='none';
  applyWatermark();
  renderList('');
}

var MONCLI={}, MONQ='', MONEST='', MONVEND='', MONORD='avg', MONLOADED=false, MONCARGANDO=false, MONERR='';

function cargarMonitoreo(){
  if(MONCARGANDO)return; MONCARGANDO=true; MONERR='';
  var base=(CLOUD.db||SK_DB).replace(/\/$/,'');
  fetch(base+'/skan/_index.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(idx){
    var vs=(idx&&idx.vendors)||[];
    if(!vs.length)throw new Error('sin vendedores publicados');
    return Promise.all(vs.map(function(k){
      return fetch(base+'/skan/'+encodeURIComponent(k)+'.json',{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return null;});
    }));
  }).then(function(ps){
    var m={};
    (ps||[]).forEach(function(p){
      if(!p||!p.rows)return;
      var vn=p.v||'';
      p.rows.forEach(function(r){
        m[r.n]={nombre:r.n,vend:r.vd||vn,avg:r.avg||0,mix:r.mix||0,mixp:(r.mixp!=null?r.mixp:r.mix)||0,cur:r.cur||0,
          qtd:(r.qtd!=null?r.qtd:(r.cur||0)),qp:r.qp||0,qpb:(r.qpb!=null?r.qpb:r.qp)||0,estado:r.e||'',pm:r.pm||null,
          desc:(r.desc!=null?r.desc:null),crecio:!!r.crecio,premOk:!!r.premOk,boost:r.boost||0,
          evalSac:r.evalSac||0,antSac:r.antSac||0,premEval:r.premEval||0};
      });
    });
    MONCLI=m; MONLOADED=true; MONCARGANDO=false;
    if(VIEW==='monitoreo')renderMonitoreo();
  }).catch(function(e){

    if(VIEW==='monitoreo')renderMonitoreo();
  });
}

// ── Descuento vigente y descuento en construcción ────────────────────────────
// El vigente viene YA CALCULADO desde el programa de ventas (campo desc): así la app
// nunca puede desviarse del número oficial. El proyectado sí se calcula aquí, con lo
// que el cliente lleva comprado en el mes en curso.
var MESNOM={1:'enero',2:'febrero',3:'marzo',4:'abril',5:'mayo',6:'junio',7:'julio',8:'agosto',9:'septiembre',10:'octubre',11:'noviembre',12:'diciembre'};
function mesSig(m){ return m?(MESNOM[(m%12)+1]||'el mes siguiente'):'el mes siguiente'; }   // sin mes conocido NO debe caer en enero
function descBloques(c,t){
  if(!t||t[0]==='INICIAL')return '';
  var fijo=t[2],kc=t[3],kp=t[4],uc=t[5];
  var vig=(c.desc!=null)?c.desc:null;
  // Si el reporte publicado en la nube todavía es de una versión anterior, no trae el desglose.
  // Se avisa en vez de pintar bloques a medias con ceros.
  if(vig==null&&!c.evalSac){
    return '<div class="dbox"><div class="dlbl">Desglose del descuento</div>'+
      '<div class="dsub" style="margin-top:4px">Para verlo, tu gerente debe volver a publicar el reporte desde el programa de ventas. '+
      'Mientras tanto abajo siguen las metas del periodo.</div></div>';
  }
  var h='';
  // Mes que corre hoy. Si el reporte cargado termina justo al cerrar un mes, MESCURSO viene en 0
  // (todavía no hay ventas del mes nuevo): entonces el mes en curso es el siguiente al evaluado.
  // El mes que se muestra lo manda el calendario (MESVIT): el día 1 ya se ven los objetivos
  // del mes nuevo aunque todavía no se haya cargado una sola venta. Solo hay avance real
  // (enCurso) cuando el reporte ya trae ventas de ESE mismo mes.
  var mesAct = MESVIT || MESCURSO || (MESEVAL ? ((MESEVAL%12)+1) : 0);
  var enCurso = !!MESCURSO && MESCURSO===mesAct;
  // ── A · lo que paga HOY ──
  if(vig!=null){
    var pz=[];
    pz.push({t:'Fijo de su nivel',v:fijo,ok:true});
    pz.push({t:'Creció '+(c.antSac!=null&&c.evalSac!=null?('de '+fmt(c.antSac)+' a '+fmt(c.evalSac)+' sacos'):('+'+uc+'%')),v:(c.crecio?kc:0),ok:!!c.crecio});
    pz.push({t:'Premium base ('+fmt(c.premEval||0)+' sacos, '+(c.mix||0).toFixed(1)+'%)',v:(c.premOk?kp:0),ok:!!c.premOk});
    pz.push({t:'Premium+ '+((c.boost||0)>=PREM.e2?'escalón 2 (≥'+PREM.u2+'%)':((c.boost||0)>0?'escalón 1 (≥'+PREM.u1+'%)':'(no alcanzó el '+PREM.u1+'%)'))+' · mix '+(c.mixp||0).toFixed(1)+'%',v:(c.boost||0),ok:(c.boost||0)>0});
    h+='<div class="dbox">';
    h+='<div class="dtop"><div><div class="dlbl">Descuento que paga en '+(MESNOM[mesAct]||'este mes')+'</div>'+
       '<div class="dsub">Se calculó al cerrar '+(MESNOM[MESEVAL]||'el mes pasado')+' y ya no cambia'+(CORTE&&CORTE.fecha?(' · corte del '+CORTE.fecha):'')+'</div></div>'+
       '<div class="dnum">'+vig.toFixed(2)+'%</div></div>';
    pz.forEach(function(p){
      h+='<div class="drow'+(p.ok?' si':' no')+'"><span>'+(p.ok?'✓':'✗')+' '+p.t+'</span><b>'+(p.v>0?('+'+p.v.toFixed(2)+'%'):'—')+'</b></div>';
    });
    h+='</div>';
  }
  // ── B · lo que va construyendo para el mes siguiente ──
  var refVol=Math.round(c.avg||0);
  var mBase=Math.round(PREM.base/100*refVol), m1=Math.round(PREM.u1/100*refVol), m2=Math.round(PREM.u2/100*refVol);
  // Sin ventas del mes en curso, el avance arranca en cero: si se usara c.cur se estaría
  // mostrando otra vez el mes ya evaluado como si fuera progreso del mes nuevo.
  var pbNow=enCurso?(c.qpb||0):0, pmNow=enCurso?(c.qp||0):0;
  var pctBase=refVol>0?(pbNow/refVol*100):0, pctMix=refVol>0?(pmNow/refVol*100):0;
  var okPrem=pctBase>=PREM.base;
  var boostNow=premBoost(pctMix);
  var base=c.evalSac||0, hoy=enCurso?(c.cur||0):0;
  var crecNow=base>0?((hoy-base)/base*100):0;
  var okCrec=(base>0&&hoy>0&&crecNow>=uc);
  var proy=fijo+(okCrec?kc:0)+(okPrem?kp:0)+boostNow;
  var metaCrec=Math.round(base*(1+uc/100));
  function barra(pct,col){ return '<div class="pbar"><i style="width:'+Math.max(0,Math.min(100,pct))+'%;background:'+col+'"></i></div>'; }
  h+='<div class="dbox proy">';
  h+='<div class="dtop"><div><div class="dlbl">Va ganando para '+(mesSig(mesAct))+'</div>'+
     '<div class="dsub">'+(enCurso
        ? ('Con lo que lleva comprado en '+(MESNOM[mesAct]||'el mes en curso')+'. Cambia con cada pedido.')
        : ((MESNOM[mesAct]||'El mes')+' apenas comienza: el avance se verá en cuanto se cargue el primer reporte del mes.'))+'</div></div>'+
     '<div class="dnum proyn">'+proy.toFixed(2)+'%</div></div>';
  // crecimiento
  h+='<div class="drow'+(okCrec?' si':' no')+'"><span>'+(okCrec?'✓':'○')+' Crecer +'+uc+'%: lleva '+fmt(hoy)+' de '+fmt(metaCrec)+' sacos</span><b>'+(okCrec?'+'+kc.toFixed(2)+'%':'+'+kc.toFixed(2)+'% pendiente')+'</b></div>';
  h+=barra(metaCrec>0?hoy/metaCrec*100:0, okCrec?'#22c55e':'#E8A020');
  // premium base
  h+='<div class="drow'+(okPrem?' si':' no')+'"><span>'+(okPrem?'✓':'○')+' Premium base: lleva '+fmt(pbNow)+' de '+fmt(mBase)+' sacos</span><b>'+(okPrem?'+'+kp.toFixed(2)+'%':'+'+kp.toFixed(2)+'% pendiente')+'</b></div>';
  h+=barra(mBase>0?pbNow/mBase*100:0, okPrem?'#22c55e':'#E8A020');
  // Premium+ · los dos escalones por separado, cada uno con su meta en sacos.
  // Son EXCLUYENTES: se cobra el más alto alcanzado, no los dos.
  var ok1=pctMix>=PREM.u1, ok2=pctMix>=PREM.u2;
  h+='<div class="drow'+(ok1?' si':' no')+'"><span>'+(ok1?'✓':'○')+' Premium+ escalón 1 (mix ≥'+PREM.u1+'%): lleva '+fmt(pmNow)+' de '+fmt(m1)+' sacos</span><b>'+(ok2?'—':(ok1?('+'+PREM.e1.toFixed(2)+'%'):('+'+PREM.e1.toFixed(2)+'% pendiente')))+'</b></div>';
  h+=barra(m1>0?pmNow/m1*100:0, ok1?'#22c55e':'#E8A020');
  h+='<div class="drow'+(ok2?' si':' no')+'"><span>'+(ok2?'✓':'○')+' Premium+ escalón 2 (mix ≥'+PREM.u2+'%): lleva '+fmt(pmNow)+' de '+fmt(m2)+' sacos</span><b>'+(ok2?('+'+PREM.e2.toFixed(2)+'%'):('+'+PREM.e2.toFixed(2)+'% pendiente'))+'</b></div>';
  h+=barra(m2>0?pmNow/m2*100:0, ok2?'#22c55e':'#E8A020');
  var sigMeta=ok2?null:(ok1?m2:m1);
  var sigExtra=ok2?null:(ok1?PREM.e2:PREM.e1);
  if(sigMeta!=null)h+='<div class="dhint">Con '+fmt(Math.max(0,sigMeta-pmNow))+' sacos más de premium o gato sube a +'+sigExtra.toFixed(2)+'% extra. Los dos escalones no se suman: cuenta el más alto que alcance.</div>';
  else h+='<div class="dhint">Ya está en el Premium+ máximo.</div>';
  h+='</div>';
  return h;
}

function showCard(name){
  const c=CLIENTS[name]||(typeof MONCLI!=='undefined'&&MONCLI[name]);if(!c)return;CARDOPEN=true;const t=tierOf(c.avg);const nx=nextTier(t[0]);
  const fijo=t[2],kc=t[3],kp=t[4],uc=t[5];
  const maintain=t[0]==='INICIAL'?200:t[1];
  const M=PMULT();                       // 1 si evaluación mensual, 3 si trimestral
  const PW=perWord();                     // 'mes' o 'trimestre'
  const qLab=perLabel();
  // metas del periodo (mensual x1 o trimestral x3)
  const maintainQ=maintain*M;
  const nextQ=nx?nx[1]*M:null;
  const growQ=t[0]==='INICIAL'?null:Math.round(c.avg*M*(1+uc/100));

  const refVol=Math.round((c.avg||0)*M);                 // referencia = PROMEDIO MENSUAL del cliente × periodo (evita mañosos)
  const premNeedQ=Math.round(PREM.base/100*refVol);
  const qpBasePct=(refVol>0)?((c.qpb||0)/refVol*100):0;  // % premium BASE vs promedio → 3%
  const qpMixPct=(refVol>0)?((c.qp||0)/refVol*100):0;    // % familia MIX vs promedio → +0.5/+1%
  const premOk=qpBasePct>=PREM.base;
  const curBoost=premBoost(qpMixPct);
  const descMax=t[0]==='INICIAL'?0:(fijo+kc+kp+PREM.e2);
  const app=document.getElementById('app');
  // avance del periodo en curso
  let qnow='';
  if(APPQ){

    const faltaMant=Math.max(0,maintainQ-(c.qtd||0));
    const s=t[0]==='INICIAL'
      ? ((c.qtd||0)>=bronceRitmo? 'Ya lleva ritmo para entrar a Cobre este '+PW+'.' : 'Le faltan '+fmt(bronceRitmo-(c.qtd||0))+' sacos en el '+PW+' para el ritmo de Cobre.')
      : (faltaMant<=0? '✓ Ya aseguró el volumen para mantener '+nivLab(t[0])+' este '+PW+'.' : 'Le faltan '+fmt(faltaMant)+' sacos en el '+PW+' para asegurar su nivel.');
    qnow='<div class="qnow"><div class="h">Va este '+PW+' ('+qLab+')</div><div class="b">'+fmt(c.qtd||0)+' sacos</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="s">'+s+'</div></div>';
  }
  let need='';

    need='<div class="row no"><span class="t">Para entrar a Cobre y empezar a ganar descuento</span><span class="v">'+fmt(bronceRitmo)+' sacos<br>en el '+PW+'</span></div>';
  }else{
    need+='<h3>Para GANAR el tope de su nivel ('+(fijo+kc+kp).toFixed(2)+'%)</h3>';
    need+='<div class="row'+(premOk?' ok':' no')+'"><span class="t">Premium base ≥'+PREM.base+'% de su promedio<br><span style="font-size:11px;color:#8792a3">Silver Kan Premium 25/20 + Silver Cat 15 · va '+fmt(c.qpb||0)+' sacos ('+qpBasePct.toFixed(1)+'%)</span></span><span class="v">'+fmt(premNeedQ)+' sacos<br>premium'+(premOk?' ✓':'')+'</span></div>';
    need+='<div class="row"><span class="t">Crecer +'+uc+'% vs. su ritmo</span><span class="v">llegar a '+fmt(growQ)+' sacos<br>en el '+PW+'</span></div>';
    // Bono Premium+ — descuento EXTRA por subir el mix premium
    const need1=Math.round(PREM.u1/100*refVol);
    const need2=Math.round(PREM.u2/100*refVol);
    need+='<h3>Bono Premium+ · hasta '+descMax.toFixed(2)+'% (extra por más premium)</h3>';
    need+='<div style="font-size:11.5px;color:#3d4552;padding:0 2px 8px">Cuenta cualquier presentación de <b>Premium (25 kg o 20 kg)</b> o <b>Silver Cat 15 kg</b>. Compra estos sacos en el '+PW+' para ganar el descuento extra:</div>';
    need+='<div class="row'+(qpMixPct>=PREM.u1?' ok':'')+'"><span class="t">Comprar <b>'+fmt(need1)+' sacos</b> de premium o gato<br><span style="font-size:11px;color:#8792a3">(mix ≥'+PREM.u1+'%)</span></span><span class="v">+'+PREM.e1+'% extra'+(qpMixPct>=PREM.u1?' ✓':'')+'</span></div>';
    need+='<div class="row'+(qpMixPct>=PREM.u2?' ok':'')+'"><span class="t">Comprar <b>'+fmt(need2)+' sacos</b> de premium o gato<br><span style="font-size:11px;color:#8792a3">(mix ≥'+PREM.u2+'%)</span></span><span class="v">+'+PREM.e2+'% extra'+(qpMixPct>=PREM.u2?' ✓':'')+'</span></div>';
    need+='<div style="font-size:11px;color:#8792a3;padding:2px 4px 8px">Va '+fmt(c.qp||0)+' sacos premium/gato ('+qpMixPct.toFixed(1)+'%). Bono actual del cliente: <b>+'+curBoost.toFixed(2)+'%</b>.</div>';
    need+='<h3>Para MANTENER o SUBIR de nivel</h3>';
    need+='<div class="row"><span class="t">Mantener '+nivLab(t[0])+'</span><span class="v">'+fmt(maintainQ)+' sacos<br>en el '+PW+'</span></div>';
    if(nx)need+='<div class="row"><span class="t">Subir a '+nivLab(nx[0])+'</span><span class="v">'+fmt(nextQ)+' sacos<br>en el '+PW+'</span></div>';
  }
  app.innerHTML='<button class="back" onclick="volverLista()">‹ Volver a la lista</button>'+syncBar()+
   '<div class="card"><div class="top" style="background:'+NIVBG[t[0]]+'"><h2>'+c.nombre+'</h2>'+(c.vend?'<div class="vend">Vendedor: '+c.vend+'</div>':'')+'<div class="badge">Nivel '+nivLab(t[0])+'</div></div>'+
   '<div class="kpis"><div class="kpi"><div class="n">'+fmt(c.avg)+'</div><div class="l">sacos/mes</div></div>'+
   '<div class="kpi"><div class="n">'+c.mix.toFixed(1)+'%</div><div class="l">Premium '+(c.mix>=PREM.base?'✓':'(falta '+PREM.base+'%)')+'</div></div>'+
   '<div class="kpi"><div class="n">'+(t[0]==='INICIAL'?'—':fijo.toFixed(2)+'%')+'</div><div class="l">Descuento fijo<br>de su nivel</div></div></div>'+
   descBloques(c,t)+
   qnow+
   '<div class="need">'+need+'</div>'+
   '<div class="msg">Las metas están en <b>sacos del '+PW+' completo</b>. El descuento ganado se paga como <b>nota de crédito</b> en su primera compra del periodo siguiente. El PetFood también cuenta y recibe descuento.</div>'+
   prodMesHtml(c)+
   '</div>'+
   '<div class="foot">Silver Kan / Los 19 Hermanos · Programa 04MAS ('+(APPEVAL==='MES'?'mensual':'trimestral')+') · Nivel por promedio mensual (PetFood incluido).</div>';
  window.scrollTo(0,0);
}

// ── Candado de licencia (tu panel manda) + carga en vivo + auto-refresco ──
function skBlocked(){var w=document.getElementById('wrap');if(w)w.innerHTML='<div style="text-align:center;padding:54px 16px"><div style="font-size:44px">🔒</div><h2 style="color:#E8A020;margin:10px 0">Servicio no disponible</h2><p class="hint">Esta app está desactivada temporalmente. Contacta a tu gerente.</p></div>';}
function skGate(cb){fetch(SK_DB+'/licencia.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(l){if(l&&l.activa===true)cb();else skBlocked();}).catch(function(){cb();});}
// ── Apagado POR VENDEDOR: el gerente puede desactivar a un solo vendedor sin afectar a los demás ──
function skVendBlocked(){var w=document.getElementById('wrap');if(w)w.innerHTML='<div style="text-align:center;padding:54px 16px"><div style="font-size:44px">🚫</div><h2 style="color:#E8A020;margin:10px 0">Acceso desactivado</h2><p class="hint">Tu acceso a esta app fue desactivado por tu gerente. Contáctalo si crees que es un error.</p></div>';}
function vBlocked(b){return b===true||(b&&b.blocked===true);}
function skVendorGate(cb){
  var q=parseHash(); var v=q.v||''; if(!v){cb();return;}
  var DB=(q.db||SK_DB).replace(/\/$/,'');
  fetch(DB+'/skan/_vblock/'+encodeURIComponent(v)+'.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(b){ if(vBlocked(b))skVendBlocked(); else cb(); }).catch(function(){cb();});
}
// refresco silencioso: solo cuando el vendedor está en la lista de clientes (no interrumpe una tarjeta)
function skPoll(){ if(!CLOUD.v)return;
  var base=CLOUD.db.replace(/\/$/,'');
  lockHeartbeat();   // mantiene "vivo" el candado de este dispositivo mientras siga usando la app
  // corta la sesión abierta si el gerente desactiva a este vendedor
  fetch(base+'/skan/_vblock/'+encodeURIComponent(CLOUD.v)+'.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(b){if(vBlocked(b))skVendBlocked();}).catch(function(){});
  if(VIEW!=='clientes'||CARDOPEN)return;   // no refrescar mientras una tarjeta está abierta (se cerraría sola)
  if(buscandoAhora())return;               // ni encima de una búsqueda en curso: se cerraría el teclado
  fetch(base+'/skan/'+encodeURIComponent(CLOUD.v)+'.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(p){ if(p&&p.rows){ if(CARDOPEN)return; applyPayload(p); renderList(CLISTQ); } }).catch(function(){}); }
// ── Candado por DISPOSITIVO: el primer teléfono que abre el link queda autorizado; otro teléfono se bloquea ──
function skDeviceBlocked(){var w=document.getElementById('wrap');if(w)w.innerHTML='<div style="text-align:center;padding:54px 16px"><div style="font-size:44px">📵</div><h2 style="color:#E8A020;margin:10px 0">App bloqueada en este teléfono</h2><p class="hint">Esta app ya está activada en otro dispositivo. Si cambiaste de teléfono, pide a tu gerente que <b>libere tu acceso</b>.</p></div>';}
/* Safari (sobre todo iPhone) borra localStorage solo (Intelligent Tracking Prevention tras ~7 días sin
   usar el sitio, "Borrar historial y datos de sitios web", o abrir el link dentro de WhatsApp/Instagram
   en vez de Safari — cada uno guarda su propio storage). Cuando eso pasa, el teléfono del vendedor
   pierde su "mine" y se ve a sí mismo como dispositivo nuevo, chocando con el candado que dejó su
   sesión anterior. Para no bloquear al dueño legítimo, si el candado lleva más de LOCK_STALE_MS sin
   dar señales de vida (ver lockHeartbeat), se considera abandonado y el nuevo dispositivo lo toma solo. */
var LOCK_STALE_MS = 1000*60*60*72; // 72h
var _lastLockPing = 0;
function lockHeartbeat(){
  var q=parseHash(); var v=q.v||''; if(!v)return;
  var DB=(q.db||SK_DB).replace(/\/$/,''); var lk='sk_dev_'+v; var mine='';
  try{ mine=localStorage.getItem(lk)||''; }catch(e){}
  if(!mine)return;
  var now=Date.now(); if(now-_lastLockPing<1000*60*10)return; // máx 1 vez cada 10 min
  _lastLockPing=now;
  try{ fetch(DB+'/locks/'+encodeURIComponent(v)+'.json',{method:'PUT',body:JSON.stringify({dev:mine,ts:now})}).catch(function(){}); }catch(e){}
}
function skDeviceLock(cb){
  var q=parseHash(); var v=q.v||''; if(!v){ cb(); return; }
  var DB=(q.db||SK_DB).replace(/\/$/,''); var lk='sk_dev_'+v; var mine='';
  try{ mine=localStorage.getItem(lk)||''; }catch(e){}
  if(!mine){ mine='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
  fetch(DB+'/locks/'+encodeURIComponent(v)+'.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(c){
    var stale = c && c.dev && c.ts && (Date.now()-c.ts>LOCK_STALE_MS);
    if(!c || !c.dev || stale){ try{localStorage.setItem(lk,mine);}catch(e){} _lastLockPing=Date.now(); fetch(DB+'/locks/'+encodeURIComponent(v)+'.json',{method:'PUT',body:JSON.stringify({dev:mine,ts:Date.now()})}).then(function(){cb();}).catch(function(){cb();}); }
    else if(c.dev===mine){ try{localStorage.setItem(lk,mine);}catch(e){} _lastLockPing=Date.now(); fetch(DB+'/locks/'+encodeURIComponent(v)+'.json',{method:'PUT',body:JSON.stringify({dev:mine,ts:Date.now()})}).catch(function(){}); cb(); }
    else { skDeviceBlocked(); }
  }).catch(function(){ cb(); }); // sin internet: no bloquea (los datos tampoco cargan)
}
applyZoom();

/* Guarda una copia de la app (el "cascarón": este HTML y el script que necesita) para que si al abrirla
   desde la pantalla de inicio el celular no tiene señal buena (típico con datos móviles), en vez de
   "Safari no puede abrir la página" cargue lo último guardado y solo falle la actualización de precios,
   que ya se avisa aparte. No afecta las llamadas a la base de datos, que siempre van en vivo. */
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
