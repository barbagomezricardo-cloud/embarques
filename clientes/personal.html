<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clientes 19H · Personal</title>
<meta name="theme-color" content="#DE0A14">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<style>
  :root{--rojo:#DE0A14;--tinta:#281E12;--papel:#FBF7F2}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tinta:#F4ECE3;--papel:#17120D}}
  :root[data-theme="dark"]{--tinta:#F4ECE3;--papel:#17120D}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:"Public Sans",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
  .c{text-align:center;display:grid;gap:14px;max-width:420px}
  .c img{width:120px;margin:0 auto}
  h1{font-family:"Archivo",system-ui,sans-serif;margin:0;font-size:24px}
  p{margin:0;opacity:.8}
  button{border:0;border-radius:12px;background:var(--rojo);color:#fff;font:800 16px system-ui,sans-serif;padding:14px 18px;cursor:pointer}
</style>
</head>
<body>
<div class="c">
  <img src="img/logo-petfood.png" alt="Los 19 Hermanos División Pet Food">
  <h1>Clientes · personal</h1>
  <p>Prepedidos, registros, mensajes y fletes de la app de clientes. Es el mismo panel que aparece en tus apps de vendedor, ventas, gerencia y programación.</p>
  <button type="button" onclick="CliStaff.abrir()">Abrir panel</button>
</div>
<script src="config.js"></script>
<script src="cli-staff.js" data-sin-boton="1"></script>
<script>window.addEventListener('load',function(){ setTimeout(function(){ CliStaff.abrir(); }, 150); });</script>
</body>
</html>
