<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>

<!-- Fórmulas de alertas de compra: las mismas del programa de Inventarios (no se duplican) -->

<script>
/* =====================================================================
   CENTRO DE MANDO GERENCIAL · Leche 19 Diecinueve Hermanos · Pet Food
   ---------------------------------------------------------------------
   SOLO LECTURA. Esta pantalla no escribe nada en Firebase: solo lee lo
   que ya publican tus apps (ventas, embarques, báscula, inventarios,
   RH y clientes) y lo resume en un solo lugar.
   Licencia: general (licencia/activa + hasta) y su propio interruptor
   en licencia/apps/centro_mando (si existe).
   Acceso: tu usuario MASTER de Inventarios o MASTER/DIRECCIÓN de RH.
   ===================================================================== */
const APP_ID = 'centro_mando';
const DB = 'https://embarques-mascotas-default-rtdb.firebaseio.com';
const FB_CFG = { apiKey: "AIzaSyBYa3yZxWML-rwxKwuXp_gTyOTkisUKe8w", authDomain: "embarques-mascotas.firebaseapp.com",
  databaseURL: DB, projectId: "embarques-mascotas", appId: "1:860212111367:web:6a020f94ef6a468af922a2" };
const APPCHECK_KEY = '6Lf4vtQtAAAAABsSvrf7bax_PgYQX1TrT3j6Rmuj';
const CLI_API = 'https://us-central1-embarques-mascotas.cloudfunctions.net/cliApi';
const CLI_LS = 'cliStaffSes';             // misma sesión que la consola del personal de Clientes
const REFRESH_MS = 2 * 60 * 1000;
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const fmt = (n, d) => (n == null || !isFinite(n)) ? '—' : Number(n).toLocaleString('es-MX', { maximumFractionDigits: d || 0, minimumFractionDigits: d || 0 });
const pct = (n, d) => (n == null || !isFinite(n)) ? '—' : (n >= 0 ? '+' : '') + (n * 100).toFixed(d == null ? 1 : d) + '%';
const pad = n => ('0' + n).slice(-2);
const hoyISO = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const vals = o => (o && typeof o === 'object') ? Object.keys(o).map(k => Object.assign({ _k: k }, o[k])) : [];
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } };
const licViva = n => !!n && n.activa === true && (!n.hasta || Date.now() < Number(n.hasta));
const sem = (r, okAt, warnAt) => r >= okAt ? 'ok' : (r >= warnAt ? 'warn' : 'bad');   // semáforo por razón de avance
/* días hábiles lunes a sábado (misma regla de la proyección de tus informes) */
function habiles(y, m, hasta) { let n = 0; for (let d = 1; d <= hasta; d++) if (new Date(y, m - 1, d).getDay() !== 0) n++; return n; }

/* ---------- Firebase: App Check + dos sesiones independientes (Inventarios y RH) ---------- */
let APP = null, AC = null, AUTH_INV = null, AUTH_RH = null;
function initFirebase() {
  APP = firebase.initializeApp(FB_CFG, 'cm');
  try { AC = firebase.appCheck(APP); AC.activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(APPCHECK_KEY), true); } catch (e) { AC = null; }
  const ai = firebase.initializeApp(FB_CFG, 'cm-inv'), ar = firebase.initializeApp(FB_CFG, 'cm-rh');
  try { firebase.appCheck(ai).activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(APPCHECK_KEY), true); } catch (e) { }
  try { firebase.appCheck(ar).activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(APPCHECK_KEY), true); } catch (e) { }
  AUTH_INV = firebase.auth(ai); AUTH_RH = firebase.auth(ar);
}
async function acToken() { if (!AC) return null; try { const t = await AC.getToken(); return t && t.token; } catch (e) { return null; } }
/* lectura REST (GET) — nunca se usa PUT/PATCH/DELETE en esta app */
async function leer(ruta, user) {
  const h = {}; const t = await acToken(); if (t) h['X-Firebase-AppCheck'] = t;
  let q = ''; if (user) { const it = await user.getIdToken(); q = '?auth=' + encodeURIComponent(it); }
  else if (ruta !== 'licencia' && window.Acceso19H) { const it = await Acceso19H.token(); if (it) q = '?auth=' + encodeURIComponent(it); }   // Acceso 19H: ventas, embarques y báscula ya solo se leen con sesión
  const r = await fetch(DB + '/' + ruta + '.json' + q, { cache: 'no-store', headers: h });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' en ' + ruta);
  return r.json();
}
const mailInv = u => String(u || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@inv19h.app';
const mailRh = u => String(u || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@rh19h.app';
const ROL_INV_OK = ['master'], ROL_RH_OK = ['master', 'director'];
async function perfil(sis) {
  const A = sis === 'inv' ? AUTH_INV : AUTH_RH; const u = A.currentUser;
  if (!u) {   // Acceso 19H: si tu usuario único tiene rol en Inventarios/RH, se usa ese
    const ap = window.Acceso19H && Acceso19H.perfil(); const uid = ap && Acceso19H.app() && Acceso19H.app().auth().currentUser && Acceso19H.app().auth().currentUser.uid;
    if (!uid) return null;
    try { const p = await leer((sis === 'inv' ? 'inv' : 'rh') + '/usuarios/' + uid, null); return p && p.activo !== false ? Object.assign({ uid }, p) : null; } catch (e) { return null; }
  }
  try { const p = await leer((sis === 'inv' ? 'inv' : 'rh') + '/usuarios/' + u.uid, u); return p && p.activo !== false ? Object.assign({ uid: u.uid }, p) : null; } catch (e) { return null; }
}
async function entrar(sis, usuario, pwd) {
  const A = sis === 'inv' ? AUTH_INV : AUTH_RH;
  await A.signInWithEmailAndPassword((sis === 'inv' ? mailInv : mailRh)(usuario), pwd);
  const p = await perfil(sis);
  const ok = p && (sis === 'inv' ? ROL_INV_OK : ROL_RH_OK).includes(p.rol);
  if (!ok) { await A.signOut(); throw new Error(sis === 'inv' ? 'Ese usuario de Inventarios no es master.' : 'Ese usuario de RH no es master ni Dirección.'); }
  return p;
}
const esperaAuth = A => new Promise(res => { const off = A.onAuthStateChanged(u => { off(); res(u); }); });

/* ---------- estado ---------- */
const S = { lic: null, inv: null, rh: null, d: {}, err: {}, ts: 0, cargando: false };

/* ================= ARRANQUE ================= */
async function boot() {
  try {
    const r = await fetch(DB + '/licencia.json', { cache: 'no-store' }); const l = await r.json(); S.lic = l;
    const app = l && l.apps && l.apps[APP_ID];
    if (!licViva(l)) return bloqueo(l && l.activa === true ? 'La licencia general venció.' : 'El sistema está desactivado desde tu Panel de Licencia.');
    if (app && (typeof app === 'object' ? !licViva(app) : app !== true)) return bloqueo('El Centro de Mando está desactivado desde tu Panel de Licencia.');
  } catch (e) { return bloqueo('No se pudo validar la licencia. Revisa tu internet y vuelve a intentar.', true); }
  try { await Acceso19H.puerta({ app: 'cm', titulo: 'Centro de Mando' }); } catch (e) { return bloqueo('No se pudo validar tu usuario. Revisa tu internet.', true); }   // Acceso 19H: tu usuario master
  initFirebase();
  await Promise.all([esperaAuth(AUTH_INV), esperaAuth(AUTH_RH)]);
  const [pi, pr] = await Promise.all([perfil('inv'), perfil('rh')]);
  S.inv = pi && ROL_INV_OK.includes(pi.rol) ? pi : null;
  S.rh = pr && ROL_RH_OK.includes(pr.rol) ? pr : null;
  if (!S.inv && !S.rh) return pantallaLogin();
  arrancar();
}
function bloqueo(msg, reintentar) {
  $('#root').innerHTML = `<div class="gate"><div style="font-size:42px">🔒</div><h1>Centro de Mando no disponible</h1><p class="mut">${esc(msg)}</p>${reintentar ? '<button class="btn pri" onclick="location.reload()">Reintentar</button>' : ''}</div>`;
}
function pantallaLogin() {
  $('#root').innerHTML = `<div class="gate"><img src="clientes/img/logo-petfood.png" alt="Los 19 Hermanos Pet Food">
    <h1>Centro de Mando Gerencial</h1><p class="mut small" style="margin:0">Entra con tu usuario <b>master de Inventarios</b> o <b>master / Dirección de RH</b>.</p>
    <input id="lu" placeholder="Usuario" autocomplete="username" autocapitalize="none" value="${esc(lsGet('cm_ult') || '')}">
    <input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="err" id="le"></div><button class="btn pri" id="lb">Entrar</button>
    <p class="mut small" style="margin-top:14px">Solo lectura · no modifica ningún dato de tus apps.</p></div>`;
  const go = async () => {
    const u = $('#lu').value.trim(), p = $('#lp').value; if (!u || !p) return;
    const b = $('#lb'); b.disabled = true; b.textContent = 'Entrando…'; $('#le').textContent = '';
    let ok = false, msg = '';
    for (const sis of ['inv', 'rh']) { try { S[sis] = await entrar(sis, u, p); ok = true; } catch (e) { if (!msg && e && e.message && !/auth\//.test(e.code || '')) msg = e.message; } }
    if (ok) { lsSet('cm_ult', u); arrancar(); return; }
    b.disabled = false; b.textContent = 'Entrar'; $('#le').textContent = msg || 'Usuario o contraseña incorrectos.';
  };
  $('#lb').onclick = go; $('#lp').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function salir() { if (!confirm('¿Cerrar sesión del Centro de Mando en este equipo?')) return; await AUTH_INV.signOut(); await AUTH_RH.signOut(); location.reload(); }

/* ================= CARGA DE DATOS ================= */
function arrancar() {
  const quien = (S.inv && S.inv.nombre) || (S.rh && S.rh.nombre) || 'Gerencia';
  $('#root').innerHTML = `<header><div class="sellos19"><span><img src="clientes/img/logo-19h.png" alt="Los 19 Hermanos"></span><span><img src="clientes/img/logo-petfood.png" alt="Pet Food"></span></div><div class="t"><b>Centro de Mando · Gerencia Comercial</b><span id="hsub">${esc(quien)} · cargando…</span></div>
    <button class="btn sm" id="bref" title="Actualizar">⟳</button><button class="btn sm" id="tema19h-btn" title="Apariencia: automático, claro u oscuro" onclick="event.stopPropagation();Tema19H.menu(this)">🌗</button><button class="btn sm" onclick="salir()" title="Cerrar sesión">Salir</button></header>
    <main><div class="card wide" id="c-alertas" style="margin-bottom:14px"><h2>🚨 Lo que requiere tu atención</h2><div class="alerts"><div class="empty"><span class="spin"></span> Reuniendo información…</div></div></div>
    <div class="grid">
      <div class="card wide" id="c-ventas"></div>
      <div class="card" id="c-clientes"></div>
      <div class="card" id="c-embarques"></div>

function pintarEmb(E) {

function conectarHtml(sis, nom, txt) {

}
function bindConectar(sis) {
  const b = $('#' + sis + '-b'); if (!b) return;
  const go = async () => {
    b.disabled = true; $('#' + sis + '-e').textContent = '';
    try { S[sis] = await entrar(sis, $('#' + sis + '-u').value.trim(), $('#' + sis + '-p').value); S.d[sis] = await (sis === 'inv' ? cargarInv() : cargarRh()); delete S.err[sis]; pintarTodo(); }
    catch (e) { b.disabled = false; $('#' + sis + '-e').textContent = /auth\//.test(e.code || '') ? 'Usuario o contraseña incorrectos.' : e.message; }
  };
  b.onclick = go; $('#' + sis + '-p').onkeydown = e => { if (e.key === 'Enter') go(); };

function pintarAlertas(V, E, B, P, I, H, C) {
  const A = [];
  const add = (lvl, t, href) => A.push({ lvl, t, href });
  if (V) {
    const avP = V.metaMes > 0 && V.proy != null ? V.proy / V.metaMes : null;
    if (avP != null && avP < 1) add(avP < .9 ? 'bad' : 'warn', `Ventas: la proyección de ${MES[V.m - 1]} (${fmt(V.proy)} sacos) va al ${Math.round(avP * 100)}% de la meta.`, 'maestra.html');
    const bajos = V.vend.filter(x => x.av != null && x.av < .9); if (bajos.length) add('warn', `${bajos.length} vendedor(es) proyectan menos del 90% de su meta: ${bajos.slice(0, 3).map(x => esc(x.n)).join(', ')}${bajos.length > 3 ? '…' : ''}.`, 'maestra.html');
    if (V.R && V.R.fugaN) add('warn', `${fmt(V.R.fugaN)} clientes bajan su compra (${fmt(V.R.fugaSac)} sacos perdidos).`, 'maestra.html');
    const pub = S.d.ventas && S.d.ventas.idx && S.d.ventas.idx.updatedStr; if (pub) { const m = pub.match(/(\d+)\/(\d+)\/(\d+)/); if (m) { const d = new Date(+m[3], +m[2] - 1, +m[1]); const dd = Math.floor((Date.now() - d) / 864e5); if (dd >= 2) add('warn', `Las ventas se publicaron hace ${dd} días (${esc(pub)}). Carga el reporte de Odoo en ventas.html.`, 'ventas.html'); } }
  }
  if (C && !C.sinSesion && C.cont) { if (C.cont.enviado) add('warn', `${C.cont.enviado} prepedido(s) de clientes esperan validación del vendedor.`, 'clientes/personal.html'); if (C.cont.confirmado) add('warn', `${C.cont.confirmado} pedido(s) confirmados por fincar en Odoo.`, 'clientes/personal.html'); if (C.pendientesRegistro) add('warn', `${C.pendientesRegistro} cliente(s) nuevo(s) por validar en la app.`, 'clientes/personal.html'); if (C.mensajesSinLeer) add('warn', `${C.mensajesSinLeer} mensaje(s) de clientes sin leer.`, 'clientes/personal.html'); }
  if (E) { if (E.incid.length) add('bad', `${E.incid.length} incidencia(s) de entrega reportadas.`, 'maestra.html'); if (E.sinPesar.length) add('warn', `${E.sinPesar.length} unidad(es) liberadas sin pesaje en báscula.`, 'programador.html'); if (E.c.car) add('ok', `${E.c.car} unidad(es) cargando en este momento.`, 'index.html'); }
  if (B && B.viejas) add('bad', `${B.viejas} entrada(s) de materia prima con más de 48 h sin cerrar su cuadre.`, 'https://barbagomezricardo-cloud.github.io/cuadre-bascula/Cuadre_Bascula_licenciado.html');
  if (P && P.minD) { const b = P.fam.filter(f => f.dias != null && f.dias < P.minD); if (b.length) add(b.some(f => f.dias < P.minD * .6) ? 'bad' : 'warn', `Producto terminado bajo el mínimo de ${P.minD} días: ${b.slice(0, 3).map(f => esc(f.n) + ' (' + fmt(f.dias) + ' d)').join(', ')}${b.length > 3 ? '…' : ''}.`, 'programador.html'); }
  if (I && I.crit.length) add('bad', `${I.crit.length} material(es) en nivel crítico de compra: ${I.crit.slice(0, 3).map(a => esc(a.it.nombre)).join(', ')}${I.crit.length > 3 ? '…' : ''}.`, 'inventarios/inventarios/index.html');
  if (H && H.pend.length) add('warn', `${H.pend.length} solicitud(es) de RH esperan autorización.`, 'rh/index.html');
  const ord = { bad: 0, warn: 1, ok: 2 }; A.sort((a, b) => ord[a.lvl] - ord[b.lvl]);
  $('#c-alertas .alerts').innerHTML = A.length ? A.map(a => `<div class="alert ${a.lvl}"><span>${a.t}</span>${a.href ? `<a href="${a.href}" target="_blank" rel="noopener">Ir ↗</a>` : ''}</div>`).join('') : '<div class="alert ok">✅ Sin pendientes críticos en este momento.</div>';
}

}
